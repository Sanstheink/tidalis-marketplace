# Isolated development/CI stack only. Hosted projects keep their own settings.
project_id = "tidalis-marketplace"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "50MiB"
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
[auth.rate_limit]
sign_in_sign_ups = 100
token_refresh = 150
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[edge_runtime]
enabled = false
[analytics]
enabled = false
